<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — QualityForge demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <a href="/">QualityForge</a>
      <nav aria-label="Main">
        <a href="/docs">Documentation</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>

    <main>
      <h1>Contact</h1>

      <form id="contact-form" novalidate>
        <!-- Every control is labelled. Tests locate by label, never by class. -->
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit">Send</button>
      </form>

      <!-- Empty and hidden by default. role=alert makes it announce to assistive tech. -->
      <p id="form-error" role="alert" hidden></p>
      <p id="form-success" role="status" hidden></p>
    </main>

    <script type="module" src="/contact.js"></script>
  </body>
</html>
