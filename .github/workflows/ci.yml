name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: saves CI minutes, no downside.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow. These jobs only read the repository and
# run its code; nothing needs write access. Declaring this explicitly means a
# compromised dependency in a test cannot reach beyond reading the tree, whatever
# the repository or organisation default happens to be.
permissions:
  contents: read

jobs:
  verify:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    # A hung job would otherwise consume the default 360 minutes.
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA, not a tag: a tag can be repointed at new code by
      # anyone who can push to the action's repository, whereas a SHA cannot.
      # The comment records which release the SHA corresponds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config after the checkout.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts are arbitrary code
      # execution on the runner. Nothing this project needs runs at install
      # time; Playwright browsers are installed by its CLI below.
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # GitHub renders a missing link target as plain text instead of failing,
      # so a broken relative link is invisible in review. One has already
      # shipped: docs/selectors-and-testid.md pointed at ../architecture.md.
      # Anchors are not checked, only file existence.
      - name: Check documentation links
        run: npm run docs:check

      # The one check that is a claim about prose rather than about code. Nothing
      # compiles the quick-start and nothing executes it, so "139 specs" survived
      # through a matrix going from one browser to three and a third-party suite
      # appearing, with every code check green throughout. This counts what
      # Playwright collects and compares; `playwright test --list` does it in a few
      # seconds without a browser.
      - name: Check documented numbers against the suite
        run: npm run docs:numbers

      # Issue #6: the client-support table is a record of observations, so the
      # rule it must not break is citation — a claim without a command and date
      # behind it, or an "untested" cell with no recorded decision, goes red.
      - name: Check the client-support table cites observations
        run: npm run docs:support

      # The security policy answers five named questions — no supported
      # versions, stdio scope, a server-side path boundary, redaction,
      # read-only — and each is a sentence that could be edited out with a
      # clean diff. docs:check proves the links resolve; this proves the
      # policy still says what a reporter would rely on.
      - name: Check the security policy answers its questions
        run: npm run docs:security

      # The only check that leaves this checkout: pack, install into a throwaway
      # project, and run what package.json promises there. Nothing else reads
      # `exports` or `bin` — the suite runs `src/` through tsx and the packlist
      # test only lists file names — so a typo in either stays green everywhere
      # and fails for the first time in a consumer. It carries two controls that
      # must fail, which is what keeps its own green meaningful.
      - name: Check the package installs and runs for a consumer
        run: npm run package:check

  # The Node axis, spent where Node-version sensitivity actually lives.
  #
  # The pure-logic tests are the Node-sensitive half of this repository: config
  # loading, path handling, ANSI stripping, JSON parsing and the MCP store are
  # all Node APIs, and none of them run a browser. The smoke suite drives a
  # browser and touches almost no Node API whose behaviour differs between two
  # LTS lines, and it is also the expensive half: a browser leg is dominated by
  # `playwright install`, not by the suite. So both active lines run the unit
  # project here and the three engines run on the newer line only.
  #
  # The saving is larger than it looks, because the two self-seeding MCP checks
  # are not cheap either and they run per leg: 50s and 51s measured, against a
  # unit suite of 14s. Node 22 x {firefox, webkit} would have added two legs
  # that each download a browser and then spend ~100s on checks that exercise
  # no browser at all.
  #
  # This job exists mostly so the `unit` project is not orphaned. `--project`
  # selects exactly one project, so browser legs on their own would quietly stop
  # running these 135 tests, and the failure mode is invisible until somebody
  # notices a test that has not run in weeks.
  unit:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is past end-of-life; these are the two active LTS lines.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npx playwright test --project=unit

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-unit-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-unit-node${{ matrix.node }}
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      # The same evidence pipeline as the browser legs, on a run that cannot
      # produce a browser failure. If the collector or the MCP checks only work
      # when something interesting happened, this is the leg that notices.
      - name: Collect defect artifacts
        if: ${{ !cancelled() }}
        run: npm run defects:collect

      # Session and tools both start the server from the project root through
      # `npx`, which is what nothing else does. The spawn check starts it from a
      # foreign directory with no `npx` — the arrangement that actually broke
      # the artifacts root once — and it was the only MCP check running in no
      # CI job at all, which was an omission rather than a decision.
      - name: Check MCP session, tool confinement and client spawn
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/mcp-session-check.py .
          python3 scripts/mcp-tools-check.py .
          python3 scripts/mcp-spawn-check.py .

      - name: Upload defect artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defects-unit-node${{ matrix.node }}
          path: artifacts/defects/
          retention-days: 30
          if-no-files-found: ignore

  # Cost per leg, measured on this repository at 2 workers with retries on:
  #
  #   leg      suite    + collect + 2 MCP checks   browser download
  #   unit       14s          ~100s                     none
  #   chromium   17s          ~118s                 393M + 261M
  #   firefox    49s          ~150s                  306M
  #   webkit     51s          ~152s                  294M
  #
  # Five legs, and the MCP checks rather than the tests are now the largest
  # single item in every one of them. Downloads above measured against the
  # Playwright CDN from this host (109M in 13s, 102M in 14s) and will be
  # slower on a GitHub runner, which is why they are quoted as size rather than
  # time: the transfer is the part that varies, and `--with-deps` on top of it
  # is apt work whose duration is not ours to predict.
  test:
    # Node versions live in the matrix, not in `node-version`. Passing an array
    # to setup-node inside a job that already declares strategy.matrix is
    # rejected by GitHub at workflow validation, and the run fails in zero
    # seconds with no jobs and no logs. That failure mode is invisible locally:
    # the YAML is valid and PyYAML parses it happily.
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Browser download plus a suite is minutes, not hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts

      # Install only the browser this job needs. Installing all of them wastes
      # both time and disk on the runner. WebKit on Linux is the leg most likely
      # to fail here for want of a system library rather than a bug; `--with-deps`
      # is what installs them, and this step is the dominant cost of a leg.
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # --project, not the bare `npm test`, for two reasons.
      #
      # 1. This leg installed exactly one browser. `npm test` runs every project
      #    in playwright.config.ts, and the two projects whose executable is
      #    missing would fail, so the leg would go red for a reason that has
      #    nothing to do with the code.
      # 2. It keeps one browser process tree per leg. Running all three projects
      #    at once at four local workers was reported to SIGSEGV the Playwright
      #    worker twice while this matrix was being written; four subsequent
      #    full-matrix runs at four workers did not reproduce it. Treat it as
      #    unproven, not established - but a leg that runs one engine cannot hit
      #    it, and the unit project that this would otherwise drop is run by the
      #    `unit` job above.
      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }}

      # A failing run must still publish its evidence, otherwise the whole point
      # of trace/screenshot/video is lost.
      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}-node24
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.browser }}-node24
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      # Turns the run into normalized defect artifacts and enforces the
      # thresholds from config/project.json. Exit 1 here is a gate violation,
      # which is a different signal from "the tests failed". Both matter, and CI
      # should not conflate them.
      - name: Collect defect artifacts
        if: ${{ !cancelled() }}
        run: npm run defects:collect

      # Drives the server over real stdio. The envelope and the path boundary
      # cannot be checked by unit tests alone, because both depend on stdout
      # carrying JSON-RPC and nothing else.
      - name: Check MCP session and tool confinement
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/mcp-session-check.py .
          python3 scripts/mcp-tools-check.py .

      # Two rules in this repository depend on the shape Playwright writes, and both
      # were wrong when first written down: the suite-abort rule never fired on a real
      # `beforeAll` abort, and nothing at all checked that an expected failure keeps
      # its evidence. A unit test cannot catch that class of bug - it agrees with
      # whatever shape its author believed in - so this runs a real Playwright and
      # reads the report that comes out.
      #
      # Chromium only. It needs a browser, because the fixture claim goes through our
      # own page fixture, and that claim is about how Playwright records an attachment
      # rather than about any engine - so three legs would pay three times over for
      # the same fact.
      - name: Check the report-shape rules against a real report
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: npm run defects:check
        env:
          REPORT_CHECK_BROWSER: ${{ matrix.browser }}

      - name: Upload defect artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defects-${{ matrix.browser }}-node24
          path: artifacts/defects/
          retention-days: 30
          if-no-files-found: ignore

  # E3: the real client, run where the claim is made. Every other MCP check
  # speaks to the server with frames written from the same assumptions as the
  # server; this one installs the actual `opencode` binary, connects it from a
  # fresh directory outside the checkout with no `npx`, and asserts on the
  # frames that crossed the wire — read through a pass-through proxy, because
  # "connected" alone would stay green while the server quietly lost the
  # `_meta` envelope or `resultType`, neither of which a legacy-path client
  # complains about. The reverse probes for it are recorded in the commit that
  # introduced scripts/mcp-live-check.py: each assertion was made to fail.
  live-client:
    name: Live MCP client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # The check spawns dist/mcp/index.js the way a client does. --ignore-scripts
      # suppressed `prepare`, so the build is explicit here.
      - name: Build
        run: npm run build

      # Pinned client, and the URL matters more than it looks. The v2
      # installer (opencode.ai/v2/install) fetches a versioned package from
      # the npm registry - @opencode/cli-linux-x64 at this version - and the
      # check then asserts the pin twice: against `opencode --version`, and
      # against clientInfo in the initialize frame on the wire, because a pin
      # only means something if the binary that connects is the pinned one.
      # The v1 installer at opencode.ai/install was the first attempt and is
      # wrong for v2: it resolves GitHub release assets, where no v2 binary
      # exists, and without -f it saves GitHub's 404 HTML page instead of
      # failing - this step failed in CI with "gzip: stdin: not in gzip
      # format", which is that HTML reaching tar. --no-modify-path: PATH is
      # set below, in the place CI actually reads it.
      - name: Install the pinned OpenCode client
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.16 --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Connect the live client and assert the wire
        env:
          EXPECT_OPENCODE_VERSION: "2.0.16"
        run: npm run mcp:live

      # C2's cross-check against the client's own ServerCapabilitiesSchema was
      # deferred to E3 with the reason "CI has no client binary"; this job is
      # where that reason stops being true.
      - name: Cross-check advertised capabilities against the client's schema
        run: npm run mcp:schema
