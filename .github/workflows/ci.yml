name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: saves CI minutes, no downside.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow. These jobs only read the repository and
# run its code; nothing needs write access. Declaring this explicitly means a
# compromised dependency in a test cannot reach beyond reading the tree, whatever
# the repository or organisation default happens to be.
permissions:
  contents: read

jobs:
  verify:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    # A hung job would otherwise consume the default 360 minutes.
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA, not a tag: a tag can be repointed at new code by
      # anyone who can push to the action's repository, whereas a SHA cannot.
      # The comment records which release the SHA corresponds to.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config after the checkout.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Node 20 reached end-of-life with its final release in March 2026,
          # so CI uses an active LTS line instead.
          node-version: 24
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts are arbitrary code
      # execution on the runner. Nothing this project needs runs at install time;
      # Playwright browsers are installed by its CLI below, not by a postinstall.
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  test:
    name: Smoke tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Browser download plus a suite is minutes, not hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Test the two active LTS lines. Node 20 is past end-of-life.
          node-version: [22, 24]
          cache: npm

      - run: npm ci --ignore-scripts

      # Install only the browser this job needs. Installing all of them wastes
      # both time and disk on the runner.
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: npm test

      # A failing run must still publish its evidence, otherwise the whole point
      # of trace/screenshot/video is lost.
      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-${{ matrix.browser }}
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      # Turns the run into normalized defect artifacts and enforces the
      # thresholds from config/project.json. Exit 1 here is a gate violation,
      # which is a different signal from "the tests failed". Both matter, and CI
      # should not conflate them.
      - name: Collect defect artifacts
        if: ${{ !cancelled() }}
        run: npm run defects:collect

      # Drives the server over real stdio. The envelope and the path boundary
      # cannot be checked by unit tests alone, because both depend on stdout
      # carrying JSON-RPC and nothing else.
      - name: Check MCP session and tool confinement
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/mcp-session-check.py .
          python3 scripts/mcp-tools-check.py .

      - name: Upload defect artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: defects-${{ matrix.browser }}
          path: artifacts/defects/
          retention-days: 30
          if-no-files-found: ignore
